<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>GREEN – Farmer App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel=manifest href=manifest.webmanifest><meta name=theme-color content="#1b8a3f"><script src=config.js></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6fbf7;--cd:#fff;--ink:#12301f;--mut:#5a6b61;--g:#1b8a3f;--d:#0e5a30;--l:#e4f3e8;--bd:#cfe3d5;--y:#fff1bf;--r:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a13;--cd:#16261c;--ink:#e6f2ea;--mut:#9db3a5;--l:#1d3526;--bd:#2c4636;--y:#4a3d12;--d:#8fd6a5}}
:root[data-theme=dark]{--bg:#0d1a13;--cd:#16261c;--ink:#e6f2ea;--mut:#9db3a5;--l:#1d3526;--bd:#2c4636;--y:#4a3d12;--d:#8fd6a5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px Nunito,system-ui,sans-serif}
#app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.ur{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-weight:700;unicode-bidi:isolate}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--cd);border-bottom:1px solid var(--bd)}
.hd>b{font-size:20px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--l);color:var(--d);cursor:pointer}
.ht{flex:1;text-align:center;font-weight:800;font-size:18px;line-height:1.2}.ht small{display:block;font-size:15px;color:var(--mut)}
main{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
footer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:var(--cd);border-top:1px solid var(--bd)}
.b{flex:1;border:0;border-radius:14px;padding:12px 8px;font:800 16px Nunito,sans-serif;background:var(--g);color:#fff;min-height:50px;cursor:pointer;text-align:center;text-decoration:none;display:grid;place-items:center}
.b.o{background:var(--cd);color:var(--d);border:2px solid var(--g)}.b.s{min-height:42px;font-size:14px}.b:disabled{opacity:.45}
.card{background:var(--cd);border-radius:16px;padding:10px;box-shadow:0 2px 8px #0002}.mut{font-size:13px;color:var(--mut)}h2,h3{margin:2px 0}
.lg{height:80px;margin:0 auto;background:#fff;border-radius:12px;padding:4px}.far{width:100%;height:200px;object-fit:cover;border-radius:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.chip{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.big{display:flex;align-items:center;gap:12px;border-radius:20px;padding:16px;color:#fff;background:var(--g);cursor:pointer}.big.t{background:#3aa08e}.big b{font-size:20px;display:block}.big i{width:54px;height:54px;border-radius:50%;background:#fff3;display:grid;place-items:center}
svg.ic{width:24px;height:24px;fill:currentColor}.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--l);color:var(--d);cursor:pointer;flex:none;font-style:normal}.ib.mic{background:var(--g);color:#fff}
.fl{display:block;background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;padding:8px 10px}.fl div{display:flex;align-items:center;gap:8px}.fl input,.sr input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:800 18px Nunito,sans-serif;outline:0;padding:4px 0}.fl em{color:var(--r);font-size:12px;font-style:normal}
.sr{display:flex;align-items:center;gap:8px;background:var(--cd);border:1.5px solid var(--bd);border-radius:26px;padding:3px 6px 3px 14px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{position:relative;background:var(--cd);border-radius:16px;overflow:hidden;text-align:center;border:2px solid transparent;box-shadow:0 2px 8px #0002;padding-bottom:6px;cursor:pointer}.tile.sel{border-color:var(--g)}
.tile img,.tile .em{width:100%;height:96px;object-fit:cover;display:grid;place-items:center;font-size:40px;background:var(--l)}.tile b{display:block;margin-top:4px}.tile small{color:var(--mut)}.hero{width:100%;height:130px;object-fit:cover;border-radius:16px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--bd);position:relative;cursor:pointer;flex:none}.tg.on{background:var(--g)}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on::after{left:23px}
.wx{background:var(--y)}.cc{display:flex;gap:10px;border:2px solid transparent}.cc.sel{border-color:var(--g)}.cc img,.cc .em{width:84px;height:104px;object-fit:cover;border-radius:12px;display:grid;place-items:center;font-size:36px;background:var(--l);flex:none}.cc>div{flex:1;min-width:0}
.tag{display:inline-block;background:var(--g);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800}.ms{display:flex;gap:4px;margin-top:4px}.m{flex:1;background:var(--l);border-radius:10px;padding:4px;text-align:center;font-size:12px}.m b.g{color:#15803d}.m b.y{color:#a16207}.m b.r{color:var(--r)}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row span{flex:1}.row input{width:96px;text-align:right;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font:800 16px Nunito,sans-serif}
.tot{display:flex;justify-content:space-between;border-radius:14px;padding:12px;background:var(--g);color:#fff;font-weight:800;font-size:17px}.tot.p{background:var(--l);color:var(--d);font-size:20px}
.stp{display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:800}.stp i{font-style:normal;width:42px;height:42px;border-radius:12px;background:var(--l);display:grid;place-items:center;cursor:pointer}
.pv{display:flex;gap:10px}.pv img,.pv .em{width:90px;height:130px;object-fit:cover;border-radius:12px;background:var(--l);display:grid;place-items:center;font-size:36px;flex:none}.bt{display:flex;gap:6px;margin-top:8px}.rt{color:var(--d);font-weight:800}
.ov{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.ov.l{justify-content:flex-start;align-items:stretch}
.sh{background:var(--cd);border-radius:24px 24px 0 0;padding:14px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}.dr{background:var(--cd);width:82%;max-width:340px;padding:16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.mi{padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.mi:hover{background:var(--l)}.al{background:var(--y);border-radius:14px;padding:10px;font-size:14px}.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}
.ok{width:80px;height:80px;border-radius:50%;background:var(--g);color:#fff;font-size:44px;display:grid;place-items:center;margin:10px auto}.c{text-align:center}
.sk{height:96px;border-radius:16px;background:linear-gradient(90deg,var(--l),var(--bd),var(--l));background-size:200%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200%}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}#toast.on{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes rn{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(360deg)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes kb{to{transform:scale(1.12)}}@keyframes pl{0%{box-shadow:0 0 0 0 #fff8}100%{box-shadow:0 0 0 16px #fff0}}@keyframes selp{50%{transform:scale(1.04)}}@keyframes ms{to{box-shadow:0 0 0 14px #e11d4800}}@keyframes bar{from{width:0}to{width:92%}}
main.in>*{animation:up .45s both}
.b,.tile,.card[data-a],.chip,.ib,.big,.stp i{transition:transform .12s,box-shadow .2s}.b:active,.tile:active,.card[data-a]:active,.chip:active,.ib:active,.big:active,.stp i:active{transform:scale(.96)}
.lgi{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:10px}.lgi.on{background:var(--l)}.lgi.off{opacity:.5;cursor:default}.lgi i{font-style:normal;color:var(--g);font-weight:800;font-size:20px}
.av{width:76px;height:76px;border-radius:50%;background:var(--g);color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;margin:0 auto 8px}.sel{animation:selp .3s}.lg{animation:fl 4s ease-in-out infinite}.hz{overflow:hidden;border-radius:18px}.hz img{animation:kb 14s ease-in-out infinite alternate}.big i{animation:pl 2s infinite}
.ib.lis{background:#e11d48;color:#fff;box-shadow:0 0 0 0 #e11d4866;animation:ms 1s infinite}
.okw{position:relative;width:140px;height:140px;margin:14px auto}.okw .fl{transform-origin:50% 50%;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}.okw .rg{transform-origin:50% 50%;animation:rn 1s .2s ease-out both}.okw .ck{stroke-dasharray:80;stroke-dashoffset:80;animation:dr .45s .4s ease-out forwards}.cf{position:absolute;left:66px;top:66px;width:9px;height:14px;border-radius:2px;background:var(--c);opacity:0;animation:cf 1.1s ease-out forwards}
.spin{width:44px;height:44px;border:5px solid var(--l);border-top-color:var(--g);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
.ob{position:relative;width:150px;height:150px;margin:24px auto 0}.ob span{position:absolute;inset:38px;font-size:64px;text-align:center}.or{position:absolute;inset:0;border:2px dashed var(--g);border-radius:50%;animation:sp 5s linear infinite}.or i{position:absolute;top:-16px;left:57px;font-style:normal;font-size:30px}
.bar{height:8px;border-radius:4px;background:var(--l);overflow:hidden;margin:8px 20px}.bar i{display:block;height:100%;background:var(--g);animation:bar 6s ease-out forwards}
.sps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.sps small{font-size:11px;display:block}.sp polyline{stroke-dasharray:400;stroke-dashoffset:400;animation:dr 1.4s .3s forwards}
#fab{position:fixed;right:12px;bottom:92px;display:flex;flex-direction:column;gap:8px;z-index:8}#fab>*{width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:21px;font-style:normal;box-shadow:0 4px 14px #0004;cursor:pointer}#fab i{background:var(--cd);color:var(--d);border:2px solid var(--g);width:40px;height:40px;margin-left:4px;font-size:18px}#fab b.off{background:#6b7280}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

rec:()=>{const F=S.F,top=rank()[0].id,n=CR[top];return F.demo?['یہ صرف نمونے کی قیمتیں ہیں، اصل ناسا ڈیٹا نہیں ہیں۔','These are demo values only, not real NASA data.']:[`آپ کے لیے گرین کا مشورہ تیار ہے۔ ناسا کے ڈیٹا کے مطابق، پچھلے تین مہینوں میں بارش عام سے ${Math.round(F.rr*100)} فیصد رہی، اور مٹی میں نمی ${Math.round(F.wet*100)} فیصد ہے۔ اس لیے میں آپ کو ${n.u} تجویز کرتی ہوں۔ باقی منصوبے بھی دیکھ لیں، اور جو پسند آئے اسے چنیں۔`,`Here is your GREEN advice. According to NASA data, rain over the last three months was ${Math.round(F.rr*100)} percent of normal and soil wetness is ${Math.round(F.wet*100)} percent. So I suggest ${n.n}. Check the other plans too, and pick the one you like.`]}};
function guide(s,force){if(!VOICE_ON&&!force)return;if(s=='rec'&&!S.F)return;const f=GL[s];if(!f)return;const g=f();clearTimeout(guide.t);stopSpeak();guide.t=setTimeout(()=>speak(g[0],g[1]),force?0:450)}

const tiles=()=>{const q=($('#q')?.value||S.q||'').toLowerCase().trim(),tl=(id,n,u,im)=>`<div class="tile ${S.cur==id?'sel':''}" data-a=cur data-v=${id}>${im}<b>${n}</b><span class=ur>${u}</span></div>`;

rec:()=>{if(S.busy)return{h:[GH,'مشورہ'],b:'<div class=ob><div class=or><i>🛰</i></div><span>🌍</span></div><p class=c><b id=stp>Contacting NASA POWER…</b></p><div class=bar><i></i></div><p class="c mut">Real data, so this can take a few seconds.</p>'};if(!S.F)return{h:[GH,'مشورہ'],b:`<div class=al>⚠️ <b>Could not read NASA data.</b><div class=mut>${esc(S.err)}</div><div class=mut>Check your internet connection and try again. No advice is shown without real data.</div></div>`,f:`<button class="b o" data-a=demo2>Use demo values (not real)</button><button class=b data-a=retry>Retry</button>`};const F=S.F,rc=rank(),cc=CR[S.cur];if(!(CR[S.sel]&&(S.sel==S.cur||rc.some(r=>r.id==S.sel))))S.sel=rc[0].id;
